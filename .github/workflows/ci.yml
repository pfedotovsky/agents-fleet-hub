name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hub:
    name: Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fleet-hub/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fleet-hub

      - name: Build
        run: npm run build
        working-directory: fleet-hub

      - name: Lint
        run: npm run lint
        working-directory: fleet-hub

      - name: Install UX browser
        run: npx playwright install --with-deps chromium
        working-directory: fleet-hub

      - name: UX checks
        run: npm run test:ux
        working-directory: fleet-hub

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-server
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test server
